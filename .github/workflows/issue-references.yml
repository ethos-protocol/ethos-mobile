name: Issue References

# Checks that issue numbers cited in code and docs exist. Runs on pull requests
# and pushes to main, with the default token.

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  # Only PR runs are superseded; scheduled and push runs keep their results.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  issue-references:
    name: Cited issues exist
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check cited issue numbers
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .github/scripts/check_issue_refs.py
