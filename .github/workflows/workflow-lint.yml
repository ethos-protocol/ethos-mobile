name: Workflow Lint

on:
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/**"
  pull_request:
    branches: [main]
    paths:
      - ".github/workflows/**"
      - ".github/scripts/**"
      - "scripts/**"

permissions:
  contents: read

jobs:
  workflow-refs:
    name: Workflow script references resolve
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Check every script a workflow calls exists
        run: python3 .github/scripts/check_workflow_refs.py

      - name: Run workflow lint unit tests
        run: |
          python3 -m unittest discover -s .github/scripts/tests -p "test_check_workflow_refs.py" -v
          python3 -m unittest discover -s .github/scripts/tests -p "test_applinks_alert_script.py" -v
          python3 -m unittest discover -s .github/scripts/tests -p "test_verify_app_store_id.py" -v
