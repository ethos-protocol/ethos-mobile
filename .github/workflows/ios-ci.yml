name: iOS CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

defaults:
  run:
    working-directory: ios/EthosProtocol

jobs:
  verify-universal-links:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Fetch and validate AASA file
        run: |
          AASA_URL="https://ethos-protocol.app/.well-known/apple-app-site-association"
          BUNDLE_ID="com.ethosprotocol"

          echo "Fetching AASA file from $AASA_URL"
          RESPONSE=$(curl -s -w "\n%{http_code}" "$AASA_URL")
          HTTP_CODE=$(echo "$RESPONSE" | tail -n1)
          AASA_CONTENT=$(echo "$RESPONSE" | sed '$d')

          if [ "$HTTP_CODE" != "200" ]; then
            echo "❌ AASA file is unreachable (HTTP $HTTP_CODE)"
            exit 1
          fi

          echo "✓ AASA file is reachable (HTTP 200)"

          if ! echo "$AASA_CONTENT" | jq empty 2>/dev/null; then
            echo "❌ AASA file is not valid JSON"
            exit 1
          fi

          echo "✓ AASA file is valid JSON"

          if echo "$AASA_CONTENT" | jq -e '.applinks.apps | any(.appID | contains("'"$BUNDLE_ID"'"))' > /dev/null; then
            echo "✓ Bundle ID '$BUNDLE_ID' found in applinks"
          else
            echo "❌ Bundle ID '$BUNDLE_ID' not found in applinks"
            echo "AASA content:"
            echo "$AASA_CONTENT" | jq '.'
            exit 1
          fi

          echo "$AASA_CONTENT" > /tmp/aasa.json

      # Platform passkeys (PasskeyService.swift's
      # ASAuthorizationPlatformPublicKeyCredentialProvider(relyingPartyIdentifier:
      # "ethos-protocol.app")) additionally require a "webcredentials" section in the
      # AASA file, separate from "applinks" above — a misconfiguration here would only
      # surface as a runtime passkey failure on a real device, so CI checks it directly.
      - name: Verify AASA webcredentials entry for Passkeys
        run: |
          BUNDLE_ID="com.ethosprotocol"
          AASA_CONTENT=$(cat /tmp/aasa.json)

          if ! echo "$AASA_CONTENT" | jq -e '.webcredentials.apps' > /dev/null 2>&1; then
            echo "❌ AASA file has no 'webcredentials.apps' array — platform passkeys will not work"
            echo "AASA content:"
            echo "$AASA_CONTENT" | jq '.'
            exit 1
          fi

          if echo "$AASA_CONTENT" | jq -e '.webcredentials.apps | any(contains("'"$BUNDLE_ID"'"))' > /dev/null; then
            echo "✓ Bundle ID '$BUNDLE_ID' found in webcredentials"
          else
            echo "❌ Bundle ID '$BUNDLE_ID' not found in webcredentials.apps"
            echo "AASA content:"
            echo "$AASA_CONTENT" | jq '.'
            exit 1
          fi

      # The webcredentials AASA entry above is only half of what platform passkeys
      # need — iOS also requires the app to declare a matching "webcredentials"
      # Associated Domain in its entitlements (EthosProtocol.entitlements). If these
      # two drift apart, ASAuthorizationPlatformPublicKeyCredentialProvider silently
      # fails at runtime instead of at build time.
      - name: Verify entitlements declare matching webcredentials domain
        run: |
          ENTITLEMENTS="EthosProtocol/EthosProtocol.entitlements"

          if [ ! -f "$ENTITLEMENTS" ]; then
            echo "❌ Entitlements file not found at $ENTITLEMENTS"
            exit 1
          fi

          if grep -qF '<string>webcredentials:ethos-protocol.app</string>' "$ENTITLEMENTS"; then
            echo "✓ $ENTITLEMENTS declares webcredentials:ethos-protocol.app"
          else
            echo "❌ $ENTITLEMENTS does not declare 'webcredentials:ethos-protocol.app' under com.apple.developer.associated-domains"
            exit 1
          fi

  build-and-test:
    runs-on: macos-latest
    needs: verify-universal-links
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Show toolchain versions
        run: |
          xcodebuild -version
          swift --version

      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies

      - name: Show SwiftPM dependency graph
        run: swift package show-dependencies

      - name: Review dependency changes for high severity vulnerabilities
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@v4
        with:
          fail-on-severity: high
          license-check: false

      # Runs the existing EthosProtocolTests XCTest target against the SPM
      # package (Package.swift) — deliberately BEFORE the Xcode project is
      # generated below (see below for why order matters).
      #
      # Uses the "EthosProtocol-Package" scheme, not "EthosProtocol": SwiftPM
      # auto-generates one scheme per *product* plus one aggregate
      # "<manifest-name>-Package" scheme covering every target in the
      # manifest. EthosProtocolTests depends on both the EthosProtocol and
      # TTLWidget products, so Xcode doesn't attach it to either product's
      # own scheme — only the aggregate scheme has a test action configured.
      # ("xcodebuild test -scheme EthosProtocol" fails with "Scheme
      # EthosProtocol is not currently configured for the test action.")
      #
      # This step also has to run before Xcode/EthosProtocol.xcodeproj is
      # generated below: once that project exists on disk, xcodebuild's
      # implicit scheme discovery (no -project/-workspace passed) resolves
      # to its app target scheme, which is also named "EthosProtocol" and
      # also has no test action — a second, unrelated way to hit the same
      # error. Running tests first avoids that ambiguity entirely.
      #
      # `swift test` isn't used here because several files import iOS-only
      # frameworks (BackgroundTasks, WidgetKit, UIKit) that don't compile
      # for swift test's default macOS host destination.
      - name: Test (iOS Simulator) ${{ matrix.name-suffix }}
        # GitHub Actions sets CI=true for this shell, but that does NOT reach
        # the Simulator-hosted xctest process — it runs in its own sandboxed
        # environment, not inherited from the invoking shell. xcodebuild's
        # documented TEST_RUNNER_ prefix is what actually forwards a variable
        # into the test host (stripping the prefix), which is what
        # EthosProtocolTests.swift / ICloudSyncServiceTests.swift check via
        # ProcessInfo.processInfo.environment["CI"] to skip tests that need a
        # signed, hosted app process (Keychain / UNUserNotificationCenter /
        # NSUbiquitousKeyValueStore) that a bare SPM test bundle doesn't have.
        run: |
          TEST_RUNNER_CI=true xcodebuild test \
            -scheme EthosProtocol-Package \
            -destination 'platform=iOS Simulator,name=${{ matrix.simulator-name }},OS=${{ matrix.simulator-os }}' \
            -skipMacroValidation

      - name: Install XcodeGen
        run: brew install xcodegen

      # Generates Xcode/EthosProtocol.xcodeproj from project.yml — the real,
      # installable app target (+ TTLWidget extension), which Package.swift
      # alone cannot produce (it only declares library products).
      - name: Generate Xcode project (XcodeGen)
        # XcodeGen stages the new .xcodeproj in a temp dir and copies it into
        # the --project destination — it does not create that destination
        # directory itself, so `Xcode/` must exist first or the copy fails
        # with a confusing "source file doesn't exist" Cocoa error.
        run: |
          mkdir -p Xcode
          xcodegen generate --project Xcode

      # Builds the real installable app + embedded widget extension, from the
      # XcodeGen-generated project — not just the library, as the previous
      # version of this job did.
      - name: Build app (iOS Simulator)
        run: |
          xcodebuild build \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocol \
            -destination 'generic/platform=iOS Simulator' \
            -skipMacroValidation

      # Runs hosted tests that require a real app process (Keychain, UNUserNotificationCenter).
      # These tests are in EthosProtocolTests target within the Xcode project, not in the SPM
      # test bundle, because they need TEST_HOST (real app host entitlements/process).
      # Test results from the SPM tests (above) + hosted tests (here) combine to give full CI coverage.
      - name: Test (Keychain & Notifications - Hosted, iOS Simulator)
        run: |
          xcodebuild test \
            -project Xcode/EthosProtocol.xcodeproj \
            -scheme EthosProtocolTests \
            -destination 'platform=iOS Simulator,name=iPhone 17,OS=latest' \
            -skipMacroValidation
