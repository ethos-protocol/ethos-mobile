disabled_rules:
  - trailing_whitespace
  - todo

opt_in_rules:
  - empty_count
  - explicit_init
  - force_unwrapping
  - private_outlet
  - redundant_nil_coalescing

custom_rules:
  no_raw_print:
    name: "No Raw print()"
    regex: '\bprint\s*\('
    included: "Sources"
    message: "Use a DEBUG-gated logger routed through LogRedactor instead of raw print()."
    severity: warning
  # #781: user-facing Text("...") literals must go through LocalizedStrings so they are localized.
  # Warning-level while the existing literals are migrated; flags capitalised string literals.
  unlocalized_text_literal:
    name: "Unlocalized Text Literal"
    regex: '\bText\("[A-Z]'
    included: "ios/EthosProtocol/Sources"
    message: "Move this string to LocalizedStrings (Localizable.strings) instead of a Text(\"…\") literal."
    severity: warning
